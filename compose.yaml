# Local databases: development on 5432 (the backend's default DATABASE_URL) and
# test on 5433 (used automatically by the backend integration tests).
name: acme

services:
  dev-db:
    image: postgis/postgis:18-3.6
    container_name: acme-dev-postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: acme_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata_dev:/var/lib/postgresql

  test-db:
    image: postgis/postgis:18-3.6
    container_name: acme-test-postgis
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: acme_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata_test:/var/lib/postgresql

volumes:
  pgdata_dev:
  pgdata_test:
